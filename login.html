<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Platform PPL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Platform Penyuluh Pertanian</h1>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2 class="text-center">Masuk ke Akun Anda</h2>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@contoh.com">
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" placeholder="Kata sandi Anda">
            </div>
            <button class="btn" onclick="login()">Masuk</button>
            <p class="text-center mt-20">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
